# Cấu hình Render cho StudySync, chạy trên gói Free.
#
# Dữ liệu nằm trong Neon Postgres nên không mất khi deploy lại, dù gói Free
# không có persistent disk. Nhờ vậy ứng dụng chạy được trên Free mà tài khoản,
# thời khóa biểu và bài tập vẫn giữ nguyên qua mọi lần deploy.
#
# Sau khi cấu hình, đặt hai biến môi trường trong Render Dashboard
# (Settings -> Environment):
#
#   STUDYSYNC_DATABASE_URL   -> chuỗi kết nối lấy từ Neon Console
#   STUDYSYNC_SESSION_SECRET -> chuỗi ngẫu nhiên từ 32 ký tự trở lên
#
# Xem README mục "Chuyển dữ liệu sang Neon" để biết cách lấy các giá trị này
# và chuyển dữ liệu cũ lên Neon trước lần deploy đầu tiên.

services:
  - type: web
    name: studysync
    runtime: python
    plan: free
    rootDir: BAITHI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STUDYSYNC_DATABASE_URL
        sync: false
      - key: STUDYSYNC_SESSION_SECRET
        sync: false
