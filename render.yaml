# Cấu hình Render cho StudySync, chạy trên gói Free.
#
# Dữ liệu nằm trong Neon Postgres nên không mất khi deploy lại, dù gói Free
# không có persistent disk. Nhờ vậy ứng dụng chạy được trên Free mà tài khoản,
# thời khóa biểu và bài tập vẫn giữ nguyên qua mọi lần deploy.
#
# Sau khi cấu hình, đặt hai biến môi trường trong Render Dashboard
# (Settings -> Environment):
#
#   STUDYSYNC_DATABASE_URL   -> chuỗi kết nối lấy từ Neon Console
#   STUDYSYNC_SESSION_SECRET -> chuỗi ngẫu nhiên từ 32 ký tự trở lên
#
# Xem README mục "Chuyển dữ liệu sang Neon" để biết cách lấy các giá trị này
# và chuyển dữ liệu cũ lên Neon trước lần deploy đầu tiên.

services:
  - type: web
    name: studysync
    runtime: python
    plan: free
    rootDir: BAITHI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # rapidocr-onnxruntime chưa có wheel tương thích với Python mới hơn.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STUDYSYNC_DATABASE_URL
        sync: false
      - key: STUDYSYNC_SESSION_SECRET
        sync: false
      # Tiến trình web không tự gửi nhắc nữa; chạy đúng một worker riêng.
      - key: REMINDER_TICK_ENABLED
        value: "false"

  # Worker nhắc thông báo. Chỉ cần một instance vì khoá chống gửi trùng
  # nằm ở tầng dữ liệu, nên thêm worker cũng không gửi lặp.
  - type: worker
    name: studysync-reminders
    runtime: python
    plan: free
    rootDir: BAITHI
    buildCommand: pip install -r requirements.txt
    startCommand: python reminder_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STUDYSYNC_DATABASE_URL
        sync: false
      - key: FCM_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: REMINDER_TICK_SECONDS
        value: "60"
