# Render chạy frontend static, FastAPI backend và reminder worker.
# Frontend static và Vercel cùng phục vụ một bản giao diện; cả hai gọi chung API/Neon.
#
# Dữ liệu nằm trong Neon Postgres nên không mất khi deploy lại, dù gói Free
# không có persistent disk. Nhờ vậy ứng dụng chạy được trên Free mà tài khoản,
# thời khóa biểu và bài tập vẫn giữ nguyên qua mọi lần deploy.
#
# Sau khi cấu hình, đặt các biến môi trường trong Render Dashboard
# (Settings -> Environment):
#
#   STUDYSYNC_DATABASE_URL    -> chuỗi kết nối lấy từ Neon Console
#   STUDYSYNC_SESSION_SECRET  -> chuỗi ngẫu nhiên từ 32 ký tự trở lên
#   TIMETABLE_GEMINI_API_KEY  -> Gemini API key, chỉ lưu trong Render Environment
#   VITE_API_BASE_URL        -> URL HTTPS của web service dong-hanh
#   STUDYSYNC_CORS_ORIGINS   -> danh sách domain frontend, phân tách bằng dấu phẩy
#   PUBLIC_APP_URL            -> domain frontend chính (Vercel) dùng trong push/deep links
#
# Xem README mục "Chuyển dữ liệu sang Neon" để biết cách lấy các giá trị này
# và chuyển dữ liệu cũ lên Neon trước lần deploy đầu tiên.

services:
  - type: web
    name: studysync-web
    runtime: static
    plan: free
    rootDir: BAITHI/web-client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dong-hanh
    runtime: python
    plan: free
    rootDir: BAITHI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STUDYSYNC_DATABASE_URL
        sync: false
      - key: STUDYSYNC_SESSION_SECRET
        sync: false
      - key: STUDYSYNC_CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TIMETABLE_GEMINI_API_KEY
        sync: false
      - key: TIMETABLE_GEMINI_MODEL
        value: gemini-2.0-flash
      # Tiến trình web không tự gửi nhắc nữa; chạy đúng một worker riêng.
      - key: REMINDER_TICK_ENABLED
        value: "false"

  # Worker nhắc thông báo. Chỉ cần một instance vì khoá chống gửi trùng
  # nằm ở tầng dữ liệu, nên thêm worker cũng không gửi lặp.
  - type: worker
    name: studysync-reminders
    runtime: python
    plan: free
    rootDir: BAITHI
    buildCommand: pip install -r requirements.txt
    startCommand: python reminder_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STUDYSYNC_DATABASE_URL
        sync: false
      - key: FCM_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: REMINDER_TICK_SECONDS
        value: "60"
