<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin cá nhân | Thoikhoabieu.com</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #172b4d; font-family: Arial, sans-serif; background: #f6f8fc; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 6vw; color: #fff; background: #142d58; }
    .brand { color: #fff; font: bold 18px Georgia, serif; text-decoration: none; }
    .back { color: #d7c1e6; font-size: 12px; text-decoration: none; }
    .page { width: min(620px, calc(100% - 32px)); margin: 55px auto; padding: 32px; border: 1px solid #e4e9f1; border-radius: 10px; background: #fff; box-shadow: 0 18px 45px rgba(29,52,87,.08); }
    .eyebrow { margin: 0 0 10px; color: #8a55a8; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font: 34px Georgia, serif; }
    .intro { margin: 0 0 28px; color: #7d8a9f; font-size: 13px; line-height: 1.6; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; color: #52617a; font-size: 12px; font-weight: bold; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #e4e9f1; border-radius: 6px; outline: none; color: #172b4d; font-size: 14px; }
    input:focus { border-color: #E0b0FF; box-shadow: 0 0 0 3px rgba(224,176,255,.25); }
    .save { width: 100%; height: 46px; border: 0; border-radius: 6px; color: #172b4d; font-weight: bold; background: #E0b0FF; cursor: pointer; }
    .save:hover { background: #D697FF; }
    .notice { display: none; margin-top: 16px; padding: 11px; border-radius: 5px; color: #28634e; font-size: 12px; background: #e7f6ef; }
    .notice.show { display: block; }
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="../Main/">Thoikhoabieu.com</a><a class="back" href="../Main/">← Quay lại trang chính</a></header>
  <main class="page">
    <p class="eyebrow">Cài đặt tài khoản</p>
    <h1>Thông tin học sinh</h1>
    <p class="intro">Đổi tên và lớp tại đây. Sau khi lưu, thông tin sẽ tự cập nhật ở trang chính và tiêu đề thời khóa biểu.</p>
    <form onsubmit="saveProfile(event)">
      <div class="field"><label for="name">Tên hiển thị</label><input id="name" required placeholder="Ví dụ: Minh Anh"></div>
      <div class="field"><label for="className">Lớp</label><input id="className" required placeholder="Ví dụ: 8A1"></div>
      <button class="save" type="submit">Lưu thay đổi</button>
      <div class="notice" id="notice">Đã lưu thông tin. Các trang liên quan sẽ dùng tên và lớp mới.</div>
    </form>
  </main>
  <script>
    const profileKey = 'user.profile';
    const profile = JSON.parse(localStorage.getItem(profileKey) || '{}');
    document.getElementById('name').value = profile.name || 'Minh Anh';
    document.getElementById('className').value = profile.className || '8A1';
    async function syncProfileSession() {
      try {
        const response = await fetch('/api/session', { cache: 'no-store' });
        if (!response.ok) {
          window.location.replace('../Login/');
          return;
        }
        const session = await response.json();
        if (session.role !== 'student') {
          window.location.replace('../Main/');
          return;
        }
        Object.assign(profile, {
          username: session.username,
          name: profile.username === session.username && profile.name ? profile.name : session.display_name,
          className: session.class_name || profile.className || '8A1',
          role: session.role,
        });
        localStorage.setItem(profileKey, JSON.stringify(profile));
        document.getElementById('name').value = profile.name;
        document.getElementById('className').value = profile.className;
      } catch (error) {
        console.error('Không thể xác nhận phiên đăng nhập:', error);
        window.location.replace('../Login/');
      }
    }
    void syncProfileSession();
    function saveProfile(event) {
      event.preventDefault();
      localStorage.setItem(profileKey, JSON.stringify({
        ...profile,
        name: document.getElementById('name').value.trim(),
        className: document.getElementById('className').value.trim()
      }));
      document.getElementById('notice').classList.add('show');
    }
  </script>
</body>
</html>
